name: Validate and package
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libhidapi-hidraw0 libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh && bash -n setup.sh
      - run: python app.py --config-dir /tmp/ryujin-ci-preview --smoke-test --screenshot /tmp/ryujin-ci-preview.png
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ryujin-lcd-studio
          path: dist/
